<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>Budget Generator</h1>
      <p>Gerencie seus orçamentos com inteligência artificial.</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input 
          id="email" 
          type="email" 
          formControlName="email" 
          placeholder="exemplo@email.com"
          [class.invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
        >
        <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="error-text">
          <small *ngIf="loginForm.get('email')?.errors?.['required']">E-mail é obrigatório.</small>
          <small *ngIf="loginForm.get('email')?.errors?.['email']">Formato de e-mail inválido.</small>
        </div>
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <input 
          id="senha" 
          type="password" 
          formControlName="senha" 
          placeholder="Sua senha secreta"
          [class.invalid]="loginForm.get('senha')?.invalid && loginForm.get('senha')?.touched"
        >
        <div *ngIf="loginForm.get('senha')?.invalid && loginForm.get('senha')?.touched" class="error-text">
          <small *ngIf="loginForm.get('senha')?.errors?.['required']">Senha é obrigatória.</small>
        </div>
      </div>

      <div *ngIf="errorMessage" class="alert-error">
        {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="loginForm.invalid || isLoading" class="btn-primary">
        <span *ngIf="!isLoading">Entrar</span>
        <span *ngIf="isLoading" class="spinner"></span>
      </button>

      <div class="login-footer">
        Não tem uma conta? <a href="#">Cadastre-se</a>
      </div>
    </form>
  </div>
</div>
